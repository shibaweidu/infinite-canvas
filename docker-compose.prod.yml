services:
  postgres:
    image: postgres:16-alpine
    container_name: infinite-canvas-postgres
    environment:
      POSTGRES_DB: infinite_canvas
      POSTGRES_USER: infinite_canvas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinite_canvas -d infinite_canvas"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: ghcr.io/basketikun/infinite-canvas:latest
    container_name: infinite-canvas
    env_file:
      - .env.production
    environment:
      STORAGE_DRIVER: postgres
      DATABASE_DSN: postgres://infinite_canvas:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}@postgres:5432/infinite_canvas?sslmode=disable
    volumes:
      - ./data:/app/data
    ports:
      - "3002:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
